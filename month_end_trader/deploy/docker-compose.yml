# IB Gateway (headless, auto-login via IBC) + the trader, on one small always-on machine.
#   cp deploy/gateway.env.example deploy/gateway.env   (IBKR login; chmod 600; never commit)
#   cp deploy/trader.env.example  deploy/trader.env    (account id, alerts)
#   docker compose -f deploy/docker-compose.yml up -d
# Then once, over VNC (ssh -L 5900:127.0.0.1:5900 yourserver): Configure > API > Precautions >
# "Bypass Order Precautions for API orders". Settings persist in ../ibgw-settings.
# Pin the image to a release tag you have checked: https://github.com/gnzsnz/ib-gateway-docker
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    env_file: gateway.env
    volumes:
      - ../ibgw-settings:/home/ibgateway/tws_settings
    ports:
      - "127.0.0.1:4002:4004"   # paper API (container 4004)
      - "127.0.0.1:4001:4003"   # live API  (container 4003)
      - "127.0.0.1:5900:5900"   # VNC for one-time settings
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always            # also covers the first minutes while the Gateway logs in
    depends_on: [ib-gateway]
    env_file: trader.env
    environment:
      TZ: America/New_York
      MET_IB_HOST: ib-gateway
      MET_IB_PORT: "4004"      # paper. For live use 4003 (and mode: live, MET_LIVE_CONFIRM)
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../state:/app/state
      - ../reports:/app/reports
      - ../logs:/app/logs
    command: ["python", "-m", "met.cli", "run", "--config", "/app/config.yaml"]
