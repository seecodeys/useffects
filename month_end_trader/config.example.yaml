# Copy to config.yaml. Everything not listed uses the defaults in met/config.py.
mode: paper                 # paper | live. Live also needs env MET_LIVE_CONFIRM=<your live account id>

ib:
  host: 127.0.0.1
  port: 4002                # IB Gateway 4002 paper / 4001 live; TWS 7497 paper / 7496 live
  client_id: 17
  account: DU0000000        # your PAPER account id (DU...). Or set env MET_IB_ACCOUNT
  market_data_type: 1       # 1 = live (needs CME real-time data), 3 = delayed (sizing only)

strategy:
  leverage: 2.8             # FULL-size MES notional / net liq (research: 2.85), on top of your SPY core
  vol_tilt: true            # research 168: full size only if SPY 20d vol > 0.837%/day (2002-14 median), else x0.5
  low_vol_scale: 0.5
  instrument: MES
  sizing_rounding: floor    # floor (never above target) or nearest (closest contract count, capped by max_leverage)
  entry_delay_s: 1          # enter at 09:30:01 ET
  exit_lead_s: 2            # exit at 15:59:58 ET (12:59:58 on 1 pm half days)
  entry_grace_s: 90         # never enter after 09:31:30
  min_abs_gap: 0.0

signal:
  sources: [ibkr, yahoo]    # both are computed; if they disagree on direction the month is skipped
  require_agreement: true

bond:                       # leg B: long 10y T-note futures over the last 3 sessions of each month
  enabled: true
  instrument: ZN            # ZN (~$107k/contract) or MTN (Micro Ultra 10-Year, ~$11k, cash settled) below ~$150k
  leverage: 2.8             # IEF-equivalent notional / net liq; futures notional = leverage x hedge_ratio
  hedge_ratio: 0            # 0 = per instrument: ZN 1.14, MTN 0.885 (IEF beta on the futures, 2017-2026)
  entry_lead_s: 120         # enter 15:58 ET on the 4th-last session, exit 15:58 ET on the month-end session
  exit_lead_s: 300         # 15:55 ET on month-end, clear of leg A's 15:59:58 exit (12:50 on 1 pm closes)
  roll_buffer_days: 5       # never hold a contract within 5 sessions of its first notice day
  disaster_stop_pct_equity: 0.04   # flatten if the bond overlay loses 4% of equity (checked whenever CBOT trades)
  max_contracts: 0          # 0 = per instrument (ZN 20, MTN 200)
  auto_derisk: true         # bond SPRT monitor can halve or stop the leg

guardrails:
  max_leverage: 3.0         # leg A MES notional / net liq ceiling
  max_contracts: 40
  min_net_liq: 10000
  margin_buffer_pct: 0.10
  disaster_stop_pct_equity: 0.06   # flatten early if the overlay loses 6% of equity (~3% SPY move at 2x); 0 = off
  core_symbol: SPY
  core_min_weight: 0.5
  core_policy: warn                # warn | block | ignore
  auto_derisk: true                # SPRT decay monitor can halve or stop the trade

monitoring:
  start: "2026-11"
  state_dir: ./state
  report_dir: ./reports
  log_dir: ./logs
